<style>
/* Layout: one narrow column like a pocket ledger; input card on top, bottom tab bar. */
:root{
  --paper:#f4f6f9; --card:#ffffff; --ink:#16202c; --muted:#5b6777; --line:#dde2ea;

  --f-num:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e131a; --card:#171f29; --ink:#e7ecf2; --muted:#98a4b3; --line:#29333f;
  --accent:#86aee8; --accent-weak:#1c2b40; --on-accent:#0e131a;

:root[data-theme="dark"]{

  --accent:#86aee8; --accent-weak:#1c2b40; --on-accent:#0e131a;
  --good:#6cc08e; --warn:#e2a54b; --bad:#f08a80; --warn-weak:#33270f; --bad-weak:#3a1d1b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px 96px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:-.01em}

.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

.entry{display:flex;flex-direction:column;gap:10px}
textarea,input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:none;min-height:64px;font-size:17px}
textarea:focus,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;font-weight:500}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
button.danger{color:var(--bad);border-color:var(--bad)}

.pick button:first-child{border-top:none}
.pick button.sel{background:var(--accent-weak)}
.crumbs{font-size:13px;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;border:none;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;padding:6px 2px;font-weight:500}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom, 0px));z-index:40;background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 14px;display:flex;gap:14px;align-items:center;font-size:14px;max-width:calc(100% - 32px)}
.toast button{background:none;border:none;color:var(--paper);text-decoration:underline;padding:0}
.answer{background:var(--accent-weak);border-radius:var(--r);padding:12px 14px}
.answer b{font-family:var(--f-num);font-size:20px;font-weight:500}
.status-ok{color:var(--good)} .status-err{color:var(--bad)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<script>

// ---------- constants ----------

const CUR_WORDS = [
  ["australian dollars","AUD"],["australian dollar","AUD"],["singapore dollars","SGD"],["singapore dollar","SGD"],["hong kong dollars","HKD"],["hong kong dollar","HKD"],["canadian dollars","CAD"],["canadian dollar","CAD"],["new zealand dollars","NZD"],["us dollars","USD"],["us dollar","USD"],
  ["japanese yen","JPY"],["yen","JPY"],["jpy","JPY"],["dollars","USD"],["dollar","USD"],["bucks","USD"],["usd","USD"],["euros","EUR"],["euro","EUR"],["eur","EUR"],["pounds","GBP"],["pound","GBP"],["quid","GBP"],["gbp","GBP"],
  ["baht","THB"],["rupees","INR"],["rupee","INR"],["inr","INR"],["won","KRW"],["yuan","CNY"],["rmb","CNY"],["renminbi","CNY"],["ringgit","MYR"],["pesos","PHP"],["peso","PHP"],["francs","CHF"],["franc","CHF"],["rupiah","IDR"],["krona","SEK"],["kronor","SEK"],["lira","TRY"],["rand","ZAR"],["reais","BRL"]
];
const CUR_SYMBOLS = {"¥":"JPY","円":"JPY","$":"USD","€":"EUR","£":"GBP","₹":"INR","₩":"KRW","฿":"THB"};
const CUR_DEC = {JPY:0,KRW:0,IDR:0,HUF:0,ISK:0};
const PAYMENTS = [["credit card","Card"],["debit card","Card"],["apple pay","Apple Pay"],["paypay","PayPay"],["suica","Suica"],["pasmo","PASMO"],["ic card","IC card"],["bank transfer","Bank transfer"],["transfer","Bank transfer"],["cash","Cash"],["card","Card"],["visa","Card"],["mastercard","Card"]];
const MONTHS = ["january","february","march","april","may","june","july","august","september","october","november","december"];
const MON_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const WEEKDAYS = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
const DRIVE = "Google Drive";
const DEFAULT_SETTINGS = {archiveFileName:"Expense Log", defaultCurrency:"JPY", trip:null, cardFeePct:0, autoSaveSecs:3, monthlyBudget:0, archiveDest:null, merchantMap:{}, lastPayment:""};

// ---------- state ----------
const S = { mode:"loading", expenses:[], settings:{...DEFAULT_SETTINGS}, fx:null, fxdays:[], archives:[], tab:"log", pending:[], editingPending:false, answer:null, histQuery:"", histCat:"", repMonth:null, toast:null };
let store = null;

// ---------- helpers ----------
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isStandalone = window.navigator.standalone === true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parseYmd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const dayDiff = (a, b) => Math.round((parseYmd(a) - parseYmd(b)) / 864e5);
const monthKey = s => s.slice(0,7);
const monthLabel = k => { const [y,m] = k.split("-").map(Number); return `${MON_SHORT[m-1]} ${y}`; };
const dayLabel = s => { const d = parseYmd(s); const t = today(); if (s === t) return "Today"; if (s === addDays(t,-1)) return "Yesterday"; return `${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()]} ${d.getDate()} ${MON_SHORT[d.getMonth()]}${d.getFullYear() !== new Date().getFullYear() ? " " + d.getFullYear() : ""}`; };
const yen = n => "¥" + Math.round(n || 0).toLocaleString("en-US");
const fmtAmt = (a, c) => { const dec = CUR_DEC[c] ?? 2; const v = Number(a || 0).toLocaleString("en-US", {minimumFractionDigits:dec, maximumFractionDigits:dec}); return c === "JPY" ? "¥" + v : `${v} ${c}`; };
const titleCase = s => s.replace(/\b([a-z])/g, (m, c) => c.toUpperCase());
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
function toast(msg, action) {
  clearTimeout(S.toastTimer);
  S.toast = {msg, action};
  renderToast();
  S.toastTimer = setTimeout(() => { S.toast = null; renderToast(); }, action ? 10000 : 3500);
}
function renderToast() {
  const h = $("#toastHost");
  if (!S.toast) { h.innerHTML = ""; return; }
  h.innerHTML = `<div class="toast" role="status"><span>${esc(S.toast.msg)}</span>${S.toast.action ? `<button id="toastAct">${esc(S.toast.action.label)}</button>` : ""}</div>`;
  if (S.toast.action) $("#toastAct").onclick = () => { const a = S.toast.action; S.toast = null; renderToast(); a.run(); };
}

// ---------- rates ----------
function jpyPerUnit(cur, onDate) {
  if (cur === "JPY") return {rate:1, date:onDate, status:"final", source:"—"};
  let best = null;
  for (const d of S.fxdays) if (d.date <= onDate && d.rates && d.rates[cur] && d.rates.JPY && (!best || d.date > best.date)) best = d;
  if (!best && S.fx && S.fx.rates && S.fx.rates[cur] && S.fx.rates.JPY) best = S.fx;
  if (!best) return null;
  const rate = best.rates.JPY / best.rates[cur];
  const gap = dayDiff(onDate, best.date);
  return {rate, date:best.date, status: gap > 4 || gap < 0 ? "provisional" : "final", source: best.source || "ECB reference rate"};
}
function knownCurrencies() {
  const set = new Set(["JPY"]);
  if (S.fx && S.fx.rates) Object.keys(S.fx.rates).forEach(c => set.add(c));
  ["USD","EUR","GBP","AUD","CAD","CHF","CNY","HKD","INR","KRW","SGD","THB"].forEach(c => set.add(c));
  return [...set].sort((a,b) => a === "JPY" ? -1 : b === "JPY" ? 1 : a.localeCompare(b));
}
function applyConversion(e) {
  if (e.rateStatus === "statement" || e.rateStatus === "manual") return e;
  const r = jpyPerUnit(e.originalCurrency, e.date);
  if (!r) { e.exchangeRate = null; e.rateDate = null; e.rateStatus = "missing"; e.amountJPY = null; return e; }
  const fee = e.originalCurrency === "JPY" ? 0 : Number(S.settings.cardFeePct || 0);
  e.exchangeRate = r.rate; e.rateDate = r.date; e.rateStatus = r.status; e.rateSource = r.source;
  e.amountJPY = Math.round(e.originalAmount * r.rate * (1 + fee/100));
  return e;
}

// ---------- parser ----------
const NUMW = {zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90};
const SCALE = {hundred:100,thousand:1000,million:1e6};
function wordsToDigits(text) {
  const toks = text.split(/(\s+|-)/);
  const out = []; let i = 0;
  while (i < toks.length) {
    const w = toks[i].toLowerCase();
    if (w in NUMW || ((w === "a") && toks[i+2] && toks[i+2].toLowerCase() in SCALE)) {
      let total = 0, cur = 0, j = i, used = false, last = i;
      while (j < toks.length) {
        const t = toks[j].toLowerCase();
        if (/^\s+$|^-$/.test(t)) { j++; continue; }
        if (t in NUMW) { cur += NUMW[t]; used = true; last = j; j++; continue; }
        if (t === "a" && toks[j+2] && toks[j+2].toLowerCase() in SCALE) { cur += 1; last = j; j++; continue; }
        if (t in SCALE && used || (t in SCALE && cur)) { if (SCALE[t] === 100) cur *= 100; else { total += cur * SCALE[t]; cur = 0; } used = true; last = j; j++; continue; }
        if (t === "and" && used && toks[j+2] && toks[j+2].toLowerCase() in NUMW) { j++; continue; }
        break;
      }
      if (used) {
        let val = total + cur, k = last + 1;
        // "point five"
        if (toks[k+1] && toks[k+1].toLowerCase() === "point" && toks[k+3] && toks[k+3].toLowerCase() in NUMW) { val = Number(`${val}.${NUMW[toks[k+3].toLowerCase()]}`); last = k + 3; }
        out.push(String(val)); i = last + 1; continue;
      }
    }
    out.push(toks[i]); i++;
  }
  return out.join("");
}
function extractDate(t) {
  const now = today();
  const rules = [
    [/\bday before yesterday\b/, () => addDays(now,-2)],
    [/\byesterday\b/, () => addDays(now,-1)],

// ---------- questions & commands ----------
function periodFromText(t) {
  const now = today(), n = parseYmd(now);
  if (/\btoday\b/.test(t)) return {from:now, to:now, label:"today"};
  if (/\byesterday\b/.test(t)) return {from:addDays(now,-1), to:addDays(now,-1), label:"yesterday"};
  if (/\bthis week\b/.test(t)) { const back = (n.getDay()+6)%7; return {from:addDays(now,-back), to:now, label:"this week"}; }
  if (/\blast week\b/.test(t)) { const back = (n.getDay()+6)%7; return {from:addDays(now,-back-7), to:addDays(now,-back-1), label:"last week"}; }
  if (/\blast month\b/.test(t)) { const d = new Date(n.getFullYear(), n.getMonth()-1, 1); const e = new Date(n.getFullYear(), n.getMonth(), 0); return {from:ymd(d), to:ymd(e), label:"last month", month:ymd(d).slice(0,7)}; }
  if (/\bthis year\b/.test(t)) return {from:`${n.getFullYear()}-01-01`, to:now, label:"this year"};
  for (let i = 0; i < 12; i++) if (new RegExp(`\\b${MONTHS[i]}\\b`).test(t)) { let y = n.getFullYear(); if (i > n.getMonth()) y--; const e = new Date(y, i+1, 0); return {from:`${y}-${pad(i+1)}-01`, to:ymd(e), label:`${titleCase(MONTHS[i])} ${y}`, month:`${y}-${pad(i+1)}`}; }
  const d = new Date(n.getFullYear(), n.getMonth(), 1);
  return {from:ymd(d), to:now, label:"this month", month:now.slice(0,7)};
}
function tryCommand(text) {
  const t = text.toLowerCase().trim();

    const p = /\b(all|everything)\b/.test(t) ? null : periodFromText(t);
    openArchive(p && p.month ? p.month : (p ? null : "all"));
    return true;
  }
  if (/^(how much|what did i spend|what have i spent|what'?s my total|show (me )?(my )?(total|spending))/.test(t)) {
    const p = periodFromText(t);

    const rows = S.expenses.filter(e => e.date >= p.from && e.date <= p.to && (!cat || e.category === cat));
    const sum = rows.reduce((a, e) => a + (e.amountJPY || 0), 0);
    S.answer = {q:text, sum, count:rows.length, label:`${cat ? cat + ", " : ""}${p.label}`};
    S.pending = [];

// ---------- storage (on this iPhone: IndexedDB, with localStorage fallback) ----------
const IDB = {
  db: null,

      const r = indexedDB.open("voice-expense-logger", 1);
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore("expenses", {keyPath: "id"}); d.createObjectStore("kv"); };

  },
  req(store, mode, fn) {

      t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);

  S.archives = (await IDB.get("kv", "archives")) || [];

    kind: "idb",
    async add(e) { const id = e.id || uid(); const rec = {...e, id}; await IDB.put("expenses", rec); S.expenses.push(rec); render(); return id; },
    async update(id, patch) { const i = S.expenses.findIndex(x => x.id === id); if (i < 0) return; const rec = {...S.expenses[i], ...patch}; await IDB.put("expenses", rec); S.expenses[i] = rec; liveRender(); },
    async remove(id) { await IDB.del("expenses", id); S.expenses = S.expenses.filter(x => x.id !== id); render(); },
    async saveSettings(patch) { S.settings = {...S.settings, ...patch}; await IDB.put("kv", S.settings, "settings"); liveRender(); },
    async addArchive(a) { S.archives = [...S.archives, {id: uid(), ...a}]; await IDB.put("kv", S.archives, "archives"); liveRender(); },
    async saveFx() { const m = {}; S.fxdays.forEach(d => m[d.date] = d); await IDB.put("kv", m, "fxdays"); await IDB.put("kv", S.fx, "fxlatest"); }

// ---------- exchange rates (ECB reference rates via Frankfurter, fetched directly) ----------
const FX_API = "https://api.frankfurter.dev/v1/";

  if (!force && S.fx && S.fx.fetchedAt && Date.now() - Date.parse(S.fx.fetchedAt) < 6 * 3600e3) return;
  try {
    const r = await fetch(FX_API + "latest?base=USD", {cache: "no-store"});
    if (!r.ok) return;
    const j = await r.json();
    if (!j.rates || !j.rates.JPY) return;
    const doc = {date: j.date, base: "USD", source: "ECB reference rates via Frankfurter", fetchedAt: new Date().toISOString(), rates: {...j.rates, USD: 1}};
    S.fx = doc; addFxDay(doc); await store.saveFx(); liveRender(); recheckProvisional();
  } catch (e) { /* offline: keep cached rates */ }
}
async function ensureRateFor(date) {
  if (S.fxdays.some(d => d.date <= date && dayDiff(date, d.date) <= 4)) return true;
  if (S.fx && date > S.fx.date) return false; // future of latest: provisional until published
  try {
    const r = await fetch(FX_API + date + "?base=USD");
    if (!r.ok) return false;
    const j = await r.json();
    if (!j.rates || !j.rates.JPY) return false;
    addFxDay({date: j.date, base: "USD", source: "ECB reference rates via Frankfurter", rates: {...j.rates, USD: 1}});
    await store.saveFx();
    return true;
  } catch (e) { return false; }
}
let rechecking = false;
async function recheckProvisional() {
  if (rechecking || !store) return;
  const todo = S.expenses.filter(e => e.rateStatus === "provisional" || (e.rateStatus === "missing" && e.originalCurrency !== "JPY"));
  if (!todo.length) return;
  rechecking = true;
  try {
    for (const e of todo) {
      await ensureRateFor(e.date);
      const r = jpyPerUnit(e.originalCurrency, e.date);
      if (!r) continue;
      if (e.rateStatus === "missing" || r.status === "final") {
        const c = applyConversion({...e});
        await store.update(e.id, {exchangeRate: c.exchangeRate, rateDate: c.rateDate, rateStatus: c.rateStatus, rateSource: c.rateSource || null, amountJPY: c.amountJPY, updatedAt: new Date().toISOString()});
      }
    }
  } catch (e) {} finally { rechecking = false; }
}

// ---------- expense building / saving ----------

    payment: p.payment || S.settings.lastPayment || "", originalAmount: Number(p.amount || 0), originalCurrency: cur,
    isBusiness: !!p.isBusiness, tags: [], trip: (S.settings.trip && cur === S.settings.trip.currency) ? S.settings.trip.name : "",

async function savePending() {
  const items = S.pending.filter(p => p.amount != null && p.amount > 0);

  clearInterval(S.countTimer);
  const ids = [];
  try {
    for (const p of items) {
      const e = p.manualJPY != null ? {...buildExpense(p), amountJPY: Math.round(p.manualJPY), exchangeRate: p.manualJPY / p.amount, rateStatus: p.currency === "JPY" ? "final" : "manual", rateDate: p.date} : buildExpense(p);

    }

  } catch (e) { onDbErr(e); }

  if (ids.length) toast(ids.length === 1 ? "Saved" : `Saved ${ids.length} expenses`, {label:"Undo", run: async () => { for (const id of ids) await store.remove(id).catch(()=>{}); toast("Removed"); }});

  setTimeout(() => { const t = $("#say"); if (t && document.activeElement !== t) t.value = ""; }, 400);
  setTimeout(() => { const t = $("#say"); if (t && document.activeElement !== t) t.value = ""; }, 1200);

  const items = parseInput(text, ctx);

  if (foreign.length) await Promise.race([Promise.all(foreign.map(i => ensureRateFor(i.date))), new Promise(r => setTimeout(r, 4000))]);

// ---------- CSV ----------
const COLS = ["Entry ID","Date","Description","Merchant","Category","Payment","Original amount","Original currency","Rate (JPY per unit)","Rate date","Rate status","JPY amount","Business","Trip","Notes","Transcript"];
function rowOf(e) { return [e.id, e.date, e.description, e.merchant, e.category, e.payment, e.originalAmount, e.originalCurrency, e.exchangeRate != null ? Number(e.exchangeRate).toFixed(6) : "", e.rateDate || "", e.rateStatus || "", e.amountJPY ?? "", e.isBusiness ? "Yes" : "No", e.trip || "", e.notes || "", e.rawTranscript || ""]; }
const csvCell = v => { const s = String(v ?? ""); return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
const toCsv = rows => rows.map(r => r.map(csvCell).join(",")).join("\n");
function parseCsv(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i+1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c !== ""));
}
// ---------- files: share sheet on iPhone, download elsewhere ----------
async function saveFile(name, text, type) {
  const blob = new Blob([text], {type});
  try {
    const file = new File([blob], name, {type});
    if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: name}); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
async function downloadCsv(list, filename) {
  if (!list.length) { toast("No expenses to download."); return; }
  const sorted = [...list].sort((a, b) => a.date.localeCompare(b.date));
  await saveFile(filename, "﻿" + toCsv([COLS, ...sorted.map(rowOf)]), "text/csv");
}
async function exportBackup() {
  const data = {app: "voice-expense-logger", version: 1, exportedAt: new Date().toISOString(), expenses: S.expenses, settings: S.settings, archives: S.archives};
  await saveFile(`expense-backup-${today()}.json`, JSON.stringify(data), "application/json");
}
const FIELD_OF = {"entry id": "id", "date": "date", "description": "description", "merchant": "merchant", "category": "category", "payment": "payment", "original amount": "originalAmount", "original currency": "originalCurrency", "rate (jpy per unit)": "exchangeRate", "rate date": "rateDate", "rate status": "rateStatus", "jpy amount": "amountJPY", "business": "isBusiness", "trip": "trip", "notes": "notes", "transcript": "rawTranscript"};
async function importFile(file) {
  const text = (await file.text()).replace(/^﻿/, "");
  const have = new Set(S.expenses.map(e => e.id));
  let list = [];
  if (/^\s*\{/.test(text)) {
    const j = JSON.parse(text);
    list = j.expenses || [];
    if (j.settings && !S.expenses.length) await store.saveSettings({...j.settings});
    if (Array.isArray(j.archives) && !S.archives.length) for (const a of j.archives) await store.addArchive(a);
  } else {
    const t = parseCsv(text); const h = (t[0] || []).map(x => FIELD_OF[x.trim().toLowerCase()] || null);
    if (!h.includes("date") || !h.includes("originalAmount")) { toast("That file isn't an expense CSV from this app."); return; }
    list = t.slice(1).map(r => {
      const e = {}; h.forEach((f, i) => { if (f) e[f] = r[i]; });
      e.originalAmount = Number(e.originalAmount) || 0; e.amountJPY = e.amountJPY === "" || e.amountJPY == null ? null : Number(e.amountJPY);
      e.exchangeRate = e.exchangeRate ? Number(e.exchangeRate) : (e.originalCurrency === "JPY" ? 1 : null);
      e.isBusiness = /^(yes|true|1)$/i.test(e.isBusiness || ""); e.originalCurrency = e.originalCurrency || "JPY";
      e.category = CATS.includes(e.category) ? e.category : "Other"; e.source = "import"; e.tags = [];
      e.archivedAt = null; e.archiveFileId = null; e.createdAt = e.updatedAt = new Date().toISOString();
      return e;
    });
  }
  let n = 0;
  for (const e of list) { if (!e.date || (e.id && have.has(e.id))) continue; try { await store.add(e); n++; } catch (er) {} }
  toast(`Imported ${n} expense${n === 1 ? "" : "s"}${list.length - n ? `, skipped ${list.length - n}` : ""}`);
  render();
}

const CFG = window.APP_CONFIG || {};
const SCOPE = "https://www.googleapis.com/auth/drive.file";
const driveReady = () => !!(CFG.GOOGLE_CLIENT_ID && CFG.GOOGLE_API_KEY && CFG.GOOGLE_APP_ID);
const redirectUri = () => location.origin + location.pathname.replace(/index\.html$/, "");
function getToken() { try { const t = JSON.parse(localStorage.getItem("g_tok") || "null"); if (t && t.exp > Date.now() + 60000) return t.v; } catch (e) {} return null; }
function signIn() {
  const p = new URLSearchParams({client_id: CFG.GOOGLE_CLIENT_ID, redirect_uri: redirectUri(), response_type: "token", scope: SCOPE, include_granted_scopes: "true", state: "drive"});

    <h2>Delete archived expenses</h2>
    ${archMonths.length ? `<div class="row"><select id="d_m" class="grow"><option value="">Choose a month</option>${archMonths.map(k => `<option value="${k}" ${k === delMonth ? "selected" : ""}>${monthLabel(k)}</option>`).join("")}</select><button class="danger" id="d_go" ${delMonth ? "" : "disabled"}>Delete</button></div>
      ${delConfirm && delMonth ? `<div class="banner" style="background:var(--bad-weak)">Delete ${delCount} archived expense${delCount === 1 ? "" : "s"} from ${monthLabel(delMonth)} from the app? Your Drive files stay as they are.<div class="row" style="margin-top:8px"><button class="danger" id="d_yes">Delete ${delCount}</button><button id="d_no">Cancel</button></div></div>` : ""}` : '<div class="small muted">Nothing archived yet. Expenses stay in the app until you delete them here or one by one.</div>'}
  </section>
  <section class="card" style="display:flex;flex-direction:column;gap:10px"><h2>Backup and restore</h2>
    <div class="small muted">Expenses are saved only on this iPhone, inside the home-screen app. ${S.expenses.length} stored. Archive to Drive or export a backup regularly: if the app is removed, unarchived records are lost.</div>
    <input type="file" id="bkImport" accept=".json,.csv,text/csv,application/json" hidden aria-label="Import a backup or CSV">
    <div class="row"><button class="grow" id="bkExport">Export backup</button><button class="grow" id="bkImportBtn">Import file</button></div>
    <div class="small muted">Import accepts a backup file from this app or a CSV downloaded from Reports, including from the claude.ai version. Rows already here are skipped.</div>
  </section>
  <section class="card" style="display:flex;flex-direction:column;gap:8px"><h2>Google account</h2>
    <div class="small muted">${!driveReady() ? "Not set up: add your keys to config.js." : getToken() ? "Signed in. Sign-in lasts about an hour, then the app asks again when you archive." : "Not signed in. You'll be asked when you archive."}</div>
    ${getToken() ? '<button id="gout" style="align-self:flex-start">Sign out</button>' : ""}
  </section>`;
}
function bindSettings() {
  const num = v => Number(String(v).replace(/,/g, "")) || 0;
  $("#s_cur").onchange = ev => store.saveSettings({defaultCurrency: ev.target.value});
  $("#s_fee").onchange = ev => store.saveSettings({cardFeePct: num(ev.target.value)});
  $("#s_budget").onchange = ev => store.saveSettings({monthlyBudget: num(ev.target.value)});
  $("#s_auto").onchange = ev => store.saveSettings({autoSaveSecs: Number(ev.target.value)});
  const saveTrip = () => { const c = $("#t_cur").value; store.saveSettings({trip: c ? {name: $("#t_name").value.trim(), currency: c, start: (S.settings.trip && S.settings.trip.start) || today(), end: $("#t_end").value || null} : null}); };
  $("#t_cur").onchange = saveTrip; $("#t_name").onchange = saveTrip; $("#t_end").onchange = saveTrip;
  const cm = $("#s_clearmap"); if (cm) cm.onclick = () => store.saveSettings({merchantMap:{}}).then(render);
  const mk = S.mmKeys || [];
  const mmSave = m => store.saveSettings({merchantMap: m}).then(render);
  document.querySelectorAll("[data-mm-cat]").forEach(el => el.onchange = () => { const k = mk[+el.dataset.mmCat]; mmSave({...S.settings.merchantMap, [k]: el.value}); });
  document.querySelectorAll("[data-mm-name]").forEach(el => el.onchange = () => { const k = mk[+el.dataset.mmName]; const nk = el.value.trim().toLowerCase(); const m = {...S.settings.merchantMap}; const c = m[k]; delete m[k]; if (nk) m[nk] = c; mmSave(m); });
  document.querySelectorAll("[data-mm-del]").forEach(el => el.onclick = () => { const m = {...S.settings.merchantMap}; delete m[mk[+el.dataset.mmDel]]; mmSave(m); });
  $("#mm_add").onclick = () => { const n = $("#mm_new").value.trim().toLowerCase(); if (!n) { toast("Type a shop name first."); return; } mmSave({...S.settings.merchantMap, [n]: $("#mm_newcat").value}); };
  const dm = $("#d_m"); if (dm) dm.onchange = ev => { delMonth = ev.target.value || null; delConfirm = false; render(); };
  const dg = $("#d_go"); if (dg) dg.onclick = () => { delConfirm = true; render(); };
  const dn = $("#d_no"); if (dn) dn.onclick = () => { delConfirm = false; render(); };
  $("#bkExport").onclick = exportBackup;
  $("#bkImportBtn").onclick = () => $("#bkImport").click();
  $("#bkImport").onchange = ev => { const f = ev.target.files && ev.target.files[0]; if (f) importFile(f).catch(() => toast("Couldn't read that file.")); ev.target.value = ""; };
  const go = $("#gout"); if (go) go.onclick = signOut;
  const dy = $("#d_yes"); if (dy) dy.onclick = async () => {
    const list = S.expenses.filter(e => e.archivedAt && monthKey(e.date) === delMonth);
    delConfirm = false; dy.disabled = true;
    let n = 0; for (const e of list) { try { await store.remove(e.id); n++; } catch (er) {} }
    toast(`Deleted ${n} archived expense${n === 1 ? "" : "s"}`); delMonth = null; render();
  };
}

// ---------- main render ----------
function render() {
  if (S.renderLock) return;
  const active = document.activeElement;
  const keepSay = active && active.id === "say" ? {v: active.value, s: active.selectionStart} : null;
  const sayVal = $("#say") ? $("#say").value : "";
  renderTabs();
  $("#syncState").textContent = S.mode === "loading" ? "Loading…" : (S.fx ? `Rates ${S.fx.date}` : "No rates yet");
  const v = $("#view");
  if (S.tab === "log") { v.innerHTML = viewLog(); bindLog(v); const ta = $("#say"); if (ta) { ta.value = sayVal; if (keepSay) { ta.focus(); try { ta.setSelectionRange(keepSay.s, keepSay.s); } catch (e) {} } } }
  else if (S.tab === "history") { v.innerHTML = viewHistory(); bindHistory(v); }
  else if (S.tab === "reports") { v.innerHTML = viewReports(); bindReports(v); }
  else if (S.tab === "archive") { v.innerHTML = viewArchive(); bindArchive(v); }
  else { v.innerHTML = viewSettings(); bindSettings(v); }
}
// Live data shouldn't wipe a field the person is typing in: defer until they leave it.
function liveRender() {
  const a = document.activeElement;
  if (a && a.closest && a.closest("#view") && a.id !== "say" && a.id !== "hq" && (a.tagName === "INPUT" || a.tagName === "SELECT" || a.tagName === "TEXTAREA")) { S.dirty = true; return; }
  render();
}
document.addEventListener("focusout", () => setTimeout(() => { if (S.dirty) { S.dirty = false; render(); } }, 0));

// ---------- boot ----------
handleOAuthReturn();
render();
(async () => {
  try { store = await makeIdbStore(); } catch (e) { store = makeLocalStore(); }
  S.mode = "device";
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}
  render();
  refreshRates();
  recheckProvisional();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshRates(); });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
})();
</script>
</body>
</html>
